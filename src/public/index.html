<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Suggestions</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
</head>
<body id="body" class="bg-neutral-900 flex justify-center items-start min-h-screen p-6">
  <div class="flex flex-col items-center bg-neutral-600/40 w-full max-w-4xl min-h-[70vh] rounded-2xl shadow-lg p-6 gap-6 border-solid border-2 border-neutral-500">
    <span class="text-neutral-400">
      Developed By Kevin ;)
      <a href="https://github.com/kev1n999" class="text-blue-700 underline">github</a>
    </span>
    <h1 class="text-white text-3xl font-semibold text-center">
      GitHub Suggestions
    </h1>

    <div class="flex flex-col gap-2 w-full max-w-sm">
      <label class="text-neutral-200 text-sm">Type your github username</label>
      <input
        id="git-username"
        type="text"
        placeholder="Username"
        class="bg-neutral-800 text-white px-4 py-2 rounded-xl outline-none border border-neutral-600 focus:border-blue-500 transition"
      />
      <button
        id="start-btn"
        class="rounded-xl text-white bg-neutral-900 px-4 py-3 cursor-pointer transition hover:bg-neutral-800 active:scale-[0.98]"
      >
        Get Suggestions
      </button>
    </div>

    <div
      id="output"
      class="w-full bg-neutral-800 text-white p-5 rounded-xl border border-neutral-700 overflow-hidden"
    >
      <div class="text-neutral-400 text-sm text-center">
        Your results will appear here...
      </div>
    </div>
  </div>
</body>
</html>
